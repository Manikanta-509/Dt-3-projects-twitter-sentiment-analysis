<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Sentiment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 400px;
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 2px solid #ff4d6d;
            border-radius: 5px;
            resize: none;
            font-size: 16px;
            margin-bottom: 10px;
        }

        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #d63e5b;
        }

        .output {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Enter Your Tweet</h2>
        <form action="{{ url_for('predict') }}" method="POST">
            <textarea name="message" placeholder="Type your tweet here..." required></textarea>
            <button type="submit">Analyze Sentiment</button>
        </form>
        {% if sentiment %}
        <div class="output">Sentiment: {{ sentiment }}</div>
        {% endif %}
    </div>

</body>
</html>
