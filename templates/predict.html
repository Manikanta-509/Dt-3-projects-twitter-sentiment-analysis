<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Sentiment Analysis</title>
    <style>
        body {
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 400px;
        }
        h2 {
            color: #ff4d6d;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 2px solid #ff4d6d;
            border-radius: 5px;
            resize: none;
            font-size: 16px;
        }
        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover {
            background: #d63e5b;
        }
        .output {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Twitter Sentiment Analysis</h2>
        <textarea id="message" placeholder="Enter your tweet..."></textarea>
        <button onclick="predictSentiment()">Analyze Sentiment</button>
        <div class="output" id="result"></div>
    </div>

    <script>
        function predictSentiment() {
            let message = document.getElementById("message").value;
            if (message.trim() === "") {
                alert("Please enter a message!");
                return;
            }
            
            // Simulating sentiment analysis output
            let sentiments = ["Positive 😊", "Negative 😞", "Neutral 😐"];
            let randomSentiment = sentiments[Math.floor(Math.random() * sentiments.length)];

            document.getElementById("result").innerHTML = "Sentiment: " + randomSentiment;
        }
    </script>

</body>
</html>
