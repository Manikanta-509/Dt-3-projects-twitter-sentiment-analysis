<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            width: 50%;
            margin: auto;
        }
        input {
            width: 80%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #ff758c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #ff5252;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sentiment Predictor</h2>
        <input type="text" id="message" placeholder="Enter your message...">
        <br>
        <button onclick="predictSentiment()">Know Sentiment</button>
        <p id="result"></p>
    </div>
    <script>
        function predictSentiment() {
            let message = document.getElementById("message").value;
            let resultElement = document.getElementById("result");
            
            if (message.toLowerCase().includes("happy") || message.toLowerCase().includes("good")) {
                resultElement.innerText = "😊 Positive Sentiment";
                resultElement.style.color = "green";
            } else if (message.toLowerCase().includes("sad") || message.toLowerCase().includes("bad")) {
                resultElement.innerText = "😞 Negative Sentiment";
                resultElement.style.color = "red";
            } else {
                resultElement.innerText = "😐 Neutral Sentiment";
                resultElement.style.color = "blue";
            }
        }
    </script>
</body>
</html>
