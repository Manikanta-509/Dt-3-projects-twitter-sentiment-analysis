<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Sentiment Analysis</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, #1e3c72, #2a5298, #00c6ff);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        input, button {
            margin-top: 15px;
            padding: 10px;
            width: 80%;
            border: none;
            border-radius: 5px;
        }

        button {
            background: #00c6ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1e3c72;
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <h1>Twitter Sentiment Analysis</h1>
        <p>Enter a Twitter handle or hashtag to analyze sentiment.</p>
        <input type="text" id="twitterInput" placeholder="Enter @handle or #hashtag">
        <button onclick="analyzeSentiment()">Analyze</button>
        <div id="result"></div>
    </div>
    <script>
        function analyzeSentiment() {
            document.getElementById("result").innerText = "Analyzing sentiment...";
            setTimeout(() => {
                document.getElementById("result").innerText = "Sentiment analysis results will be displayed here.";
            }, 2000);
        }
    </script>
</body>
</html>
